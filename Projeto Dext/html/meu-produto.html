<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitoramento de Colmeias</title>
  <link rel="stylesheet" href="../css/meu-produto.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>🐝 Monitoramento de Colmeias</h1>

<div class="add-form">
  <input type="number" id="colmeiaId" placeholder="ID da Nova Colmeia" min="1" required>
  <button onclick="adicionarColmeia()">Adicionar Colmeia</button>
</div>

<div class="dashboard" id="dashboard">
</div>

<div class="details" id="details">
  <p class="no-data">Selecione uma colmeia para ver os detalhes.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWSOZzZn3Xs-yP85EfAETqiOtsbq7-v8s",
    authDomain: "projeto-dext.firebaseapp.com",
    projectId: "projeto-dext",
    storageBucket: "projeto-dext.firebasestorage.app",
    messagingSenderId: "424409937202",
    appId: "1:424409937202:web:a94abae2af636d0d01132b",
    measurementId: "G-DRKEDLY9BS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const analytics = getAnalytics(app);

  window.firebaseDb = db;
  window.firebaseAuth = auth;

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      alert("Você precisa estar logado para acessar esta página.");
      window.location.href = 'cadastro-login.html';
    }
  });
</script>
<script type="module" src="../js/meu-produto.js"></script>

</body>
</html>
